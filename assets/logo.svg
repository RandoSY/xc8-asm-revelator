<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">XC8 ASM Revelator logo</title>
  <desc id="desc">A magnifying glass inspecting PIC assembly text beside the XC8 ASM Revelator name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233f"/>
      <stop offset="0.55" stop-color="#173b52"/>
      <stop offset="1" stop-color="#0d1a2e"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7fbff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#57c7e8" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ee7b7"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#06111f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="36" fill="url(#bg)"/>
  <path d="M0 268 C170 214 292 331 472 274 C636 222 720 118 894 151 C1032 177 1102 98 1200 74 L1200 360 L0 360 Z" fill="#0a1526" opacity="0.52"/>

  <g transform="translate(72 46)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="240" rx="22" fill="#071522" stroke="#2e6f84" stroke-width="3"/>
    <rect x="20" y="22" width="260" height="196" rx="12" fill="#0d2030" stroke="#1f5367" stroke-width="2"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#c8eef4">
      <text x="38" y="61">07E5 0182  movlb 2</text>
      <text x="38" y="98" fill="#7ee3bd">07E6 3020  movlw 0x20</text>
      <text x="38" y="135">07E7 1283  bcf STATUS,5</text>
      <text x="38" y="172" fill="#ffd166">07E8 280A  goto main</text>
    </g>
    <g transform="translate(134 50) rotate(-16)">
      <circle cx="86" cy="76" r="72" fill="url(#lens)" stroke="#ecfeff" stroke-width="12"/>
      <circle cx="65" cy="48" r="17" fill="#ffffff" opacity="0.58"/>
      <rect x="142" y="132" width="112" height="30" rx="15" fill="#ecfeff"/>
      <rect x="166" y="154" width="102" height="34" rx="17" fill="#4ee7b7"/>
    </g>
  </g>

  <g transform="translate(424 82)">
    <text x="0" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" fill="#f3fbff">XC8 ASM</text>
    <text x="0" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#accent)">Revelator</text>
    <rect x="4" y="151" width="610" height="3" rx="1.5" fill="url(#accent)" opacity="0.9"/>
    <text x="0" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#b7d8df">Inspect PIC compiler output. Find the patterns. Keep control.</text>
  </g>
</svg>
